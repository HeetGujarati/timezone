version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
    open-pull-requests-limit: 5
    # Every dependency is exact-pinned, so each bump is a deliberate, reviewable change.
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
