name: Scheduled rebuild

# The pages state facts that come from the IANA time zone database and from the
# ICU data in Node: current offsets, abbreviations, the dates the clocks next
# change. Those facts move without anyone touching this repository — a country
# changes its rules, tzdata ships a release, Node picks it up. A site built once
# and left alone starts telling people the wrong thing, quietly.
#
# So this rebuilds on a schedule, and more often around the weeks when clocks
# actually change in the two hemispheres.
on:
  schedule:
    # The first of every month, plus the first of each daylight-saving month, so
    # a March or October rules change is never more than a few weeks stale.
    - cron: '17 3 1 * *'
    - cron: '17 3 1 3,4,10,11 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild
  cancel-in-progress: false

env:
  PUBLIC_SITE_URL: https://meridiem.app

jobs:
  rebuild:
    name: Rebuild against current tzdata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Report the time zone data this build will use
        run: |
          node -e "
            const v = process.versions;
            console.log('node', v.node, '| icu', v.icu, '| tz', v.tz ?? 'bundled');
            console.log('zones', Intl.supportedValuesOf('timeZone').length);
            const f = (tz) => new Intl.DateTimeFormat('en', { timeZone: tz, timeZoneName: 'longOffset' })
              .formatToParts(Date.now()).find((p) => p.type === 'timeZoneName').value;
            for (const tz of ['Asia/Kathmandu', 'Australia/Lord_Howe', 'Pacific/Chatham', 'Europe/Kyiv']) {
              console.log(tz, f(tz));
            }
          "

      - name: Build
        run: npm run build

      - name: Post-build audits
        run: |
          npm run audit:i18n
          npm run audit:i18nleak
          npm run audit:links
          npm run audit:seo
          npm run audit:html
          npm run audit:islands
          npm run audit:headers
          npm run audit:js

      # The build is the deliverable: a host that builds from the default branch
      # on a webhook needs a commit, and there is nothing to commit — the output
      # is not tracked. So this publishes the artifact and the host's own
      # scheduled deploy hook (DEPLOY.md, "Keeping the data current") pulls it.
      - name: Upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.run_id }}
          path: dist
          retention-days: 14
          if-no-files-found: error
